name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification depth to run after local checks pass
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

jobs:
  fast:
    if: ${{ inputs.suite == 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:fast
      - run: npm run validate:skill
      - run: npm pack --dry-run

  full:
    if: ${{ inputs.suite == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:full
      - run: npm run validate:skill
      - run: npm run smoke
      - run: npm pack --dry-run
      - run: npm run smoke:package
