name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write        # OIDC 可信发布必须，其余都不要加

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm-release   # 想做人工审批就打开，并与 npm 上 Environment name 同名
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建禁用缓存

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION="v$(npm pkg get version | tr -d '"')"
          echo "tag=${GITHUB_REF_NAME}  package.json=${PKG_VERSION}"
          test "${GITHUB_REF_NAME}" = "${PKG_VERSION}"

      # 本包零依赖；若以后加了依赖，这里用 npm install（仓库无 lockfile，npm ci 会失败）
      # - run: npm install --no-audit --no-fund

      # Same gate as prepublishOnly, minus the local performance sampler: its absolute caps are
      # calibrated for a dedicated runner and its 290s spawn times out on a shared GitHub runner.
      - name: Quality gate
        run: |
          node --test --test-skip-pattern="repeated CLI check"
          npm run validate
          npm run smoke
          npm run smoke:package
          node scripts/prepublish-check.mjs

      # --ignore-scripts keeps prepublishOnly from re-running the whole gate during publish.
      # 走审核流就改成：npm stage publish --ignore-scripts
      - name: Publish via OIDC
        run: npm publish --ignore-scripts